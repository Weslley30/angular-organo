<section class="generos" [ngClass]="genero().id">
    <h3 class="texto-h3-prata">
        {{ genero().value }}
    </h3>
    <span class="linha-destaque linha-destaque--pequeno" [ngClass]="genero().id"></span>

    @if(genero().livros.length === 0){
        <div class="texto-sem-livros">
            <img src="sem-livros.png" alt="sem livros desse genero">
            <p>não há livros desse gênero</p>
        </div>
    }
    <div class="livros-genero">
        @for(livro of genero().livros; track livro) {
            <asas-livro [livro]="livro"></asas-livro>
        }
    </div>
</section>
